name: build-liburlhook

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show NDK
        run: |
          echo "NDK=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_NDK_LATEST_HOME" | head

      - name: ndk-build (arm64-v8a)
        working-directory: app/src/main/jni
        run: |
          "$ANDROID_NDK_LATEST_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            APP_ABI=arm64-v8a \
            -j4

      - name: Verify
        run: |
          ls -la app/src/main/jni/libs/arm64-v8a/
          file app/src/main/jni/libs/arm64-v8a/liburlhook.so
          sha256sum app/src/main/jni/libs/arm64-v8a/liburlhook.so

      - uses: actions/upload-artifact@v4
        with:
          name: liburlhook-arm64
          path: app/src/main/jni/libs/arm64-v8a/liburlhook.so
