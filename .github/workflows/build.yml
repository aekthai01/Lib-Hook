name: build-liburlhook
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build experimental dependency wrapper
        working-directory: research/osp-20261023-v1
        run: sh build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: osp-selfhost-arm64-20261023-v1
          path: research/osp-20261023-v1/out/
          if-no-files-found: error
          retention-days: 7
